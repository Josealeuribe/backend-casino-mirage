# Despliegue de PRODUCCION: la API se conecta a MySQL gestionado en Aiven
# (mysql-c02d8d5-innovaclub-8ae8.a.aivencloud.com), no al MySQL local que usa
# docker-compose.yml para desarrollo.
#
# Es un archivo APARTE Y AUTONOMO -- no un overlay sobre docker-compose.yml
# -- a proposito: fusionar `depends_on` entre archivos de Compose se comporta
# distinto segun la version instalada, y aqui es mas simple y confiable que
# este archivo, sencillamente, nunca declare un servicio `db` que arrancar.
#
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.production \
#     up -d --build
#
# Los secretos reales (DATABASE_URL con la contrasena de Aiven, JWT_SECRET,
# TICKET_SECRET) viven en .env.production, que NUNCA se commitea -- ver
# .env.production.example para el formato exacto. El certificado CA que
# exige Aiven (SSL REQUIRED) va en backend/prisma/aiven-ca.pem y se
# referencia por ruta relativa dentro del propio DATABASE_URL.
#
# RUN_MIGRATIONS=false A PROPOSITO: este archivo deja la CONEXION lista,
# pero no toca el esquema de la base de Aiven todavia -- ninguna tabla se
# crea sola al levantar el contenedor. Para aplicar el esquema cuando se
# decida hacerlo (una sola vez, cuando se pida explicitamente):
#   docker compose -f docker-compose.prod.yml --env-file .env.production \
#     exec api npx prisma migrate deploy
# Y para sembrar el catalogo inicial (sedes, premios, admin) despues de eso:
#   docker compose -f docker-compose.prod.yml --env-file .env.production \
#     exec api npm run prisma:seed

name: casino-arauca-prod

services:
  web:
    build:
      context: ./frontend
      args:
        FIGMA_PUBLIC_URL: ${FIGMA_PUBLIC_URL-/arauca}
        VITE_API_URL: ${VITE_API_URL-/api}
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8002}:80"
    depends_on:
      - api
    networks:
      - casino-prod

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      # Aiven, no el contenedor `db` local -- ver la nota de arriba.
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8002}
      JWT_SECRET: ${JWT_SECRET}
      TICKET_SECRET: ${TICKET_SECRET}
      SESSION_TOKEN_TTL: ${SESSION_TOKEN_TTL:-7d}
      TICKET_TTL_MINUTES: ${TICKET_TTL_MINUTES:-30}
      RUN_MIGRATIONS: "false"
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-4002}:4000"
    networks:
      - casino-prod

networks:
  casino-prod:
    driver: bridge
